# Local PostgreSQL for development.
# Start:  docker compose up -d db      Stop: docker compose down
# Data is kept in the "pgdata" volume, so it survives restarts.
services:
  db:
    image: postgres:16-alpine
    container_name: mandi-bhav-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: mandi_local_pw
      POSTGRES_DB: mandi_bhav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandi -d mandi_bhav"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
